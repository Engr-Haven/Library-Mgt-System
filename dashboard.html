  <body>
    <section class="dashboard-section-container">
      <header class="other-pg-header">
        <p>FHOJ Library</p>

        <div class="headin">
          <h1>Library Management System</h1>
        </div>
        <div class="add-logout-btn">
          <button id="add-book-btn" class="add-book-btn">Add Book</button>
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </header>

      <div class="dashboard-section">
        <div class="welcome-cont">
          <h2>Welcome, Librarian!</h2>
          <p>Use the button above to add new books to the library.</p>
        </div>
        <div class="all-cards-container" id="all-cards-container">

            <div class="icons-cont">

        </div>

    </section>

    <!-- The form modal pops up after the btn is clicked -->
    <div class="modal-section-container" id="modal-section-container">
      <div class="form-modal">
        <div class="icon-word-cont">
          <i class="fa-solid fa-circle-xmark" id="close-icon"></i>
          <h2>Add New Book</h2>
        </div>
        <form class="add-form" id="add-form">
          <div class="input-grps">
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required />
          </div>
          <div class="input-grps">
            <label for="author">Author:</label>
            <input type="text" id="author" name="author" required />
          </div>
          <div class="input-grps">
            <label for="year">Year:</label>
            <input type="number" id="year" name="year" required />
          </div>
          <div class="input-grps">
            <label for="availability">Availability:</label>
            <select name="availability" id="availability">
              <option value="✅">Available</option>
              <option value="❌">Unavailable</option>
            </select>
          </div>
          <button type="submit">Add Book</button>
        </form>
      </div>
    </div>
